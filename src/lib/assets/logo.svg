<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Diagonal stripe background -->
  <defs>
    <pattern id="diagonalStripes" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <rect width="4" height="8" fill="#000"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="#fff"/>

  <!-- Left stripe section -->
  <rect x="0" y="0" width="180" height="200" fill="url(#diagonalStripes)"/>

  <!-- Main logo area -->
  <rect x="180" y="0" width="620" height="200" fill="#fff" stroke="#000" stroke-width="4"/>

  <!-- Inner frame -->
  <rect x="200" y="20" width="580" height="160" fill="#fff" stroke="#000" stroke-width="2"/>

  <!-- Top technical label -->
  <text x="210" y="40" font-family="'Courier New', monospace" font-size="10" fill="#000" font-weight="bold">AGENTREF v1.0.0</text>

  <!-- Barcode simulation -->
  <g transform="translate(210, 50)">
    <rect x="0" y="0" width="2" height="15" fill="#000"/>
    <rect x="4" y="0" width="1" height="15" fill="#000"/>
    <rect x="7" y="0" width="3" height="15" fill="#000"/>
    <rect x="12" y="0" width="1" height="15" fill="#000"/>
    <rect x="15" y="0" width="2" height="15" fill="#000"/>
    <rect x="19" y="0" width="1" height="15" fill="#000"/>
    <rect x="22" y="0" width="3" height="15" fill="#000"/>
    <rect x="27" y="0" width="2" height="15" fill="#000"/>
    <rect x="31" y="0" width="1" height="15" fill="#000"/>
    <rect x="34" y="0" width="3" height="15" fill="#000"/>
  </g>

  <!-- Main logo text -->
  <text x="400" y="120" font-family="'Arial Black', 'Helvetica', sans-serif" font-size="72" font-weight="900" fill="#000" text-anchor="middle" letter-spacing="-2">//AG_REF</text>

  <!-- Bottom technical details -->
  <text x="210" y="165" font-family="'Courier New', monospace" font-size="9" fill="#000">INFINITE CANVAS REFERENCE BOARD</text>
  <text x="750" y="165" font-family="'Courier New', monospace" font-size="9" fill="#000" text-anchor="end">SYS.ID: 2026</text>

  <!-- Corner accent -->
  <rect x="760" y="20" width="20" height="20" fill="#000"/>
  <rect x="765" y="25" width="10" height="10" fill="#fff"/>
</svg>
